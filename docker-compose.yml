version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: nam-long-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nam_long_phase0}
      POSTGRES_USER: ${POSTGRES_USER:-nam_long}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:18-alpine
    container_name: nam-long-backend
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    environment:
      PORT: ${BACKEND_PORT:-3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - ./backend:/app
    depends_on:
      - postgres

  frontend:
    image: node:18-alpine
    container_name: nam-long-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3001"
    environment:
      PORT: ${FRONTEND_PORT:-3001}
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:3000}
    ports:
      - '${FRONTEND_PORT:-3001}:3001'
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data: